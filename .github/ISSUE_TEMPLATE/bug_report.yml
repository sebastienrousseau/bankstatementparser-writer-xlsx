name: Bug Report
description: Report a reproducible problem in bankstatementparser-writer-xlsx
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: bankstatementparser-writer-xlsx Version
      placeholder: "0.0.10"
    validations:
      required: true
  - type: input
    id: bankstatementparser_version
    attributes:
      label: bankstatementparser Version
      placeholder: "0.0.10"
    validations:
      required: true
  - type: dropdown
    id: python_version
    attributes:
      label: Python Version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: Input And Call
      description: |
        The smallest data and write_xlsx call that show the problem
        (redact any sensitive account numbers or balances - placeholder
        data is fine).
      render: python
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Output Or Error
      description: What the workbook contained (or should have), or the stack trace.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything Else
      description: Logs, the spreadsheet application and version you opened it in, etc.
