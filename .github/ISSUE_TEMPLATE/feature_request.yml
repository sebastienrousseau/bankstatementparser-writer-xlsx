name: Feature Request
description: Suggest a workbook feature or input shape for bankstatementparser-writer-xlsx
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        What can't you do today with bankstatementparser-writer-xlsx? If this surfaces an
        existing bankstatementparser helper, link to it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Sketch the change: the sheet, column or formatting, and any new
        write_xlsx argument. Reference the parent bankstatementparser API surface where
        relevant.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Real-World Use Case
      description: Who opens the workbook, and what do they do with it?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Input shapes
        - Sheet layout or formatting
        - Summary sheet
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: textarea
    id: contribution
    attributes:
      label: Willingness To Contribute
      description: Could you take a stab at the implementation or tests?
